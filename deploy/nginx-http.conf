server {
    listen 80;
    server_name nimi.uz www.nimi.uz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    # Do not accept credentials over HTTP before the certificate is installed.
    location / {
        default_type text/plain;
        add_header Retry-After 300 always;
        return 503 "Nimi is being configured. Please try again shortly.\n";
    }
}
