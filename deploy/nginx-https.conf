server {
    listen 80;
    server_name nimi.uz www.nimi.uz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://nimi.uz$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name www.nimi.uz;
    ssl_certificate /etc/letsencrypt/live/nimi.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nimi.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://nimi.uz$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name nimi.uz;
    ssl_certificate /etc/letsencrypt/live/nimi.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nimi.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 4m;
    location ~ /\. { deny all; }
    location / {
        proxy_pass http://172.18.0.1:18320;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 5s;
    }
}
