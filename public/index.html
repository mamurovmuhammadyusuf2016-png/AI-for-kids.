<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070c18">
<meta name="description" content="Nimi AI — ИИ-репетитор для школьников: помогает решать задачи самому, без готовых ответов.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nimi AI">
<title>Nimi AI</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
</head>
<body class="min-h-dvh bg-night-950 bg-[radial-gradient(ellipse_at_top,_#14224a_0%,_#070c18_60%)] font-sans text-slate-100 antialiased">
<div class="mx-auto flex h-dvh max-w-3xl flex-col px-4 pb-3 pt-4">

  <!-- Header -->
  <header class="flex items-center gap-3">
    <img src="/img/avatar.webp" data-img="avatar" alt="" class="h-11 w-11 shrink-0 rounded-full object-cover ring-2 ring-white/10">
    <div class="min-w-0 flex-1">
      <h1 class="truncate text-lg font-semibold leading-tight text-white" data-i18n="title"></h1>
      <button id="changeSetup" type="button" class="hidden max-w-full items-center gap-1 truncate text-[13px] text-slate-400 hover:text-white">
        <span id="setupChip" class="truncate"></span><span class="shrink-0" data-icon="chevron-down"></span>
      </button>
      <p id="subtitleLine" class="truncate text-[13px] text-slate-400" data-i18n="subtitle"></p>
    </div>
    <div id="timerPill" class="hidden h-10 shrink-0 items-center gap-1 rounded-full bg-night-800 px-2.5 text-sm tabular-nums text-slate-200 ring-1 ring-white/5" title="">
      <span class="text-slate-400" data-icon="clock"></span><span id="timerText">25:00</span>
    </div>
    <div id="menuWrap" class="relative">
      <button id="menuBtn" type="button" class="flex h-10 w-10 items-center justify-center rounded-full bg-night-800 text-slate-200 ring-1 ring-white/5 hover:bg-night-700" aria-label="Menu" aria-haspopup="true" data-icon="ellipsis-vertical"></button>
      <div id="menu" class="absolute right-0 top-12 z-30 hidden w-64 overflow-hidden rounded-2xl bg-night-800 py-1 shadow-2xl ring-1 ring-white/10">
        <div class="flex items-center gap-3 border-b border-white/5 px-4 py-3 text-sm text-slate-400"><span data-icon="circle-user"></span><span id="menuEmail" class="min-w-0 truncate"></span></div>
        <div class="flex items-center justify-between gap-3 px-4 py-2 text-sm text-slate-200" onclick="event.stopPropagation()">
          <span data-i18n="language"></span>
          <div class="lang-toggle flex rounded-xl bg-night-900 p-0.5 ring-1 ring-white/5" role="group" aria-label="Language">
            <button type="button" data-lang="uz" class="lang-btn lang-sm">UZ</button>
            <button type="button" data-lang="ru" class="lang-btn lang-sm">RU</button>
          </div>
        </div>
        <button type="button" data-action="change" class="menu-item flex w-full items-center gap-3 px-4 py-3 text-left text-sm text-slate-200 hover:bg-white/5"><span data-icon="pencil"></span><span data-i18n="menuChange"></span></button>
        <button type="button" data-action="report" class="menu-item flex w-full items-center gap-3 px-4 py-3 text-left text-sm text-slate-200 hover:bg-white/5"><span data-icon="file-text"></span><span data-i18n="reportBtn"></span></button>
        <button type="button" data-action="share" class="menu-item flex w-full items-center gap-3 px-4 py-3 text-left text-sm text-slate-200 hover:bg-white/5"><span data-icon="share-2"></span><span data-i18n="share"></span></button>
        <button type="button" data-action="logout" class="menu-item flex w-full items-center gap-3 border-t border-white/5 px-4 py-3 text-left text-sm text-rose-300 hover:bg-white/5"><span data-icon="log-out"></span><span data-i18n="logout"></span></button>
      </div>
    </div>
  </header>

  <!-- Auth screen: email + password or Google -->
  <main id="auth" class="mt-4 hidden flex-1 overflow-y-auto pb-2">
    <div class="flex items-center gap-4 rounded-3xl bg-night-900/80 p-4 ring-1 ring-white/5">
      <img src="/img/welcome.webp" data-img="welcome" alt="" class="h-20 w-20 shrink-0 rounded-2xl object-cover">
      <div class="min-w-0 flex-1">
        <p class="text-lg font-semibold text-white" data-i18n="welcomeTitle"></p>
        <p class="mt-1 text-sm text-slate-400" data-i18n="welcomeText"></p>
      </div>
    </div>
    <div class="mt-4 flex justify-end">
      <div class="lang-toggle flex rounded-2xl bg-night-800 p-1 ring-1 ring-white/5" role="group" aria-label="Language">
        <button type="button" data-lang="uz" class="lang-btn">UZ</button>
        <button type="button" data-lang="ru" class="lang-btn">RU</button>
      </div>
    </div>
    <section class="mt-3 rounded-3xl bg-night-900/80 p-4 ring-1 ring-white/5 sm:p-5">
      <div class="grid grid-cols-2 rounded-2xl bg-night-800 p-1 ring-1 ring-white/5" role="tablist">
        <button type="button" id="tabLogin" data-mode="login" class="auth-tab" role="tab" data-i18n="tabLogin"></button>
        <button type="button" id="tabRegister" data-mode="register" class="auth-tab" role="tab" data-i18n="tabRegister"></button>
      </div>
      <form id="authForm" class="mt-4 flex flex-col gap-3" novalidate>
        <label class="flex min-h-14 items-center gap-3 rounded-2xl bg-night-800 px-4 ring-1 ring-white/10 focus-within:ring-brand-400/60">
          <span class="text-slate-400" data-icon="mail"></span>
          <input id="authEmail" type="email" autocomplete="email" inputmode="email" maxlength="254" required class="min-w-0 flex-1 bg-transparent py-3 text-base text-slate-100 outline-none placeholder:text-slate-500">
        </label>
        <label class="flex min-h-14 items-center gap-3 rounded-2xl bg-night-800 px-4 ring-1 ring-white/10 focus-within:ring-brand-400/60">
          <span class="text-slate-400" data-icon="lock"></span>
          <input id="authPassword" type="password" autocomplete="current-password" maxlength="128" required class="min-w-0 flex-1 bg-transparent py-3 text-base text-slate-100 outline-none placeholder:text-slate-500">
          <button type="button" id="togglePassword" class="-mr-2 flex h-11 w-11 items-center justify-center rounded-full text-slate-400 hover:text-white" data-icon="eye"></button>
        </label>
        <label id="confirmWrap" class="hidden min-h-14 items-center gap-3 rounded-2xl bg-night-800 px-4 ring-1 ring-white/10 focus-within:ring-brand-400/60">
          <span class="text-slate-400" data-icon="lock"></span>
          <input id="authConfirm" type="password" autocomplete="new-password" maxlength="128" class="min-w-0 flex-1 bg-transparent py-3 text-base text-slate-100 outline-none placeholder:text-slate-500">
        </label>
        <p id="passwordHint" class="hidden px-1 text-xs text-slate-400" data-i18n="passwordHint"></p>
        <div id="authError" class="hidden items-start gap-2 rounded-2xl bg-rose-500/10 px-4 py-3 text-sm text-rose-200 ring-1 ring-rose-400/20" role="alert"></div>
        <button id="authSubmit" type="submit" class="min-h-14 rounded-2xl bg-brand-500 text-lg font-semibold text-white shadow-lg shadow-brand-500/30 transition hover:bg-brand-400 active:scale-[.98] disabled:bg-night-700 disabled:text-slate-500 disabled:shadow-none"></button>
      </form>
      <div id="googleBlock" class="hidden">
        <div class="my-4 flex items-center gap-3 text-xs uppercase tracking-wide text-slate-500"><span class="h-px flex-1 bg-white/10"></span><span data-i18n="or"></span><span class="h-px flex-1 bg-white/10"></span></div>
        <div id="googleBtn" class="flex min-h-11 justify-center"></div>
      </div>
      <p class="mt-4 flex items-start gap-2 text-xs text-slate-400"><span class="text-slate-500" data-icon="shield-check"></span><span data-i18n="authNote"></span></p>
    </section>
  </main>

  <!-- Setup screen: subject + grade -->
  <main id="setup" class="mt-4 hidden flex-1 overflow-y-auto pb-2">
    <div class="flex items-center gap-4 rounded-3xl bg-night-900/80 p-4 ring-1 ring-white/5">
      <img src="/img/welcome.webp" data-img="welcome" alt="" class="h-20 w-20 shrink-0 rounded-2xl object-cover">
      <div class="min-w-0 flex-1">
        <p class="text-lg font-semibold text-white" data-i18n="welcomeTitle"></p>
        <p class="mt-1 text-sm text-slate-400" data-i18n="welcomeText"></p>
      </div>
    </div>
    <div class="mt-4 flex items-center justify-between gap-3">
      <button id="backBtn" type="button" class="invisible flex min-h-11 items-center gap-1 rounded-full px-2 text-sm text-slate-300 hover:text-white"><span data-icon="arrow-left"></span><span data-i18n="back"></span></button>
      <div class="lang-toggle flex rounded-2xl bg-night-800 p-1 ring-1 ring-white/5" role="group" aria-label="Language">
        <button type="button" data-lang="uz" class="lang-btn">UZ</button>
        <button type="button" data-lang="ru" class="lang-btn">RU</button>
      </div>
    </div>
    <h2 class="mt-2 text-lg font-semibold text-white" data-i18n="chooseSubject"></h2>
    <div id="subjects" class="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-3"></div>
    <h2 class="mt-6 text-lg font-semibold text-white" data-i18n="chooseGrade"></h2>
    <div id="grades" class="mt-3 grid grid-cols-6 gap-2 sm:grid-cols-11"></div>
    <button id="startBtn" type="button" disabled class="mt-6 min-h-14 w-full rounded-2xl bg-brand-500 text-lg font-semibold text-white shadow-lg shadow-brand-500/30 transition hover:bg-brand-400 active:scale-[.98] disabled:cursor-not-allowed disabled:bg-night-700 disabled:text-slate-500 disabled:shadow-none" data-i18n="start"></button>
  </main>

  <!-- Learning screens: filled by learn-ui.js -->
  <main id="home" class="mt-4 hidden min-h-0 flex-1 flex-col gap-4 overflow-y-auto pb-4"></main>
  <main id="activity" class="mt-4 hidden min-h-0 flex-1 flex-col gap-4 overflow-y-auto pb-4"></main>
  <main id="progress" class="mt-4 hidden min-h-0 flex-1 flex-col gap-4 overflow-y-auto pb-4"></main>
  <main id="diary" class="mt-4 hidden min-h-0 flex-1 flex-col gap-4 overflow-y-auto pb-4"></main>

  <!-- Chat screen -->
  <main id="chatScreen" class="hidden min-h-0 flex-1 flex-col">
    <div id="chat" class="flex min-h-0 flex-1 flex-col gap-4 overflow-y-auto py-4" aria-live="polite"></div>
    <div id="notice" class="mb-2 hidden items-start gap-2 rounded-2xl bg-amber-400/10 px-4 py-3 text-sm text-amber-200 ring-1 ring-amber-400/20"></div>
    <div class="-mx-4 border-t border-white/5 px-4 pt-3">
      <div id="photoChip" class="mb-2 hidden items-center gap-3 rounded-2xl bg-night-800 p-2 pr-3 ring-1 ring-white/10">
        <img id="photoThumb" alt="" class="h-14 w-14 shrink-0 rounded-xl object-cover">
        <span class="min-w-0 flex-1 text-sm text-slate-300" data-i18n="photoReady"></span>
        <button id="photoRemove" type="button" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-slate-400 hover:bg-white/5 hover:text-white" aria-label="Remove" data-icon="x"></button>
      </div>
      <input id="photoInput" type="file" accept="image/*" class="hidden">
      <form id="form" class="flex items-end gap-2">
        <div class="relative">
          <button id="plusBtn" type="button" class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-night-800 text-slate-200 ring-1 ring-white/5 hover:bg-night-700" aria-haspopup="true" data-icon="plus"></button>
          <div id="plusMenu" class="absolute bottom-14 left-0 z-30 hidden w-60 overflow-hidden rounded-2xl bg-night-800 py-1 shadow-2xl ring-1 ring-white/10">
            <button id="photoAction" type="button" class="flex w-full items-center gap-3 px-4 py-3 text-left text-sm text-slate-200 hover:bg-white/5"><span data-icon="camera"></span><span data-i18n="photoTask"></span></button>
            <button id="newChatAction" type="button" class="flex w-full items-center gap-3 px-4 py-3 text-left text-sm text-slate-200 hover:bg-white/5"><span data-icon="rotate-ccw"></span><span data-i18n="menuNew"></span></button>
          </div>
        </div>
        <div class="flex min-h-14 min-w-0 flex-1 items-end rounded-[28px] bg-night-900 p-1.5 pl-4 ring-1 ring-white/10 focus-within:ring-brand-400/60">
          <textarea id="input" rows="1" class="max-h-36 min-h-11 min-w-0 flex-1 resize-none bg-transparent py-2.5 text-[15px] text-slate-100 outline-none placeholder:text-slate-500 disabled:text-slate-500"></textarea>
          <button id="micBtn" type="button" class="hidden h-11 w-11 shrink-0 items-center justify-center rounded-full text-slate-300 transition hover:bg-white/5 hover:text-white" data-icon="mic"></button>
          <button id="send" type="submit" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-brand-500 text-white shadow-lg shadow-brand-500/30 transition hover:bg-brand-400 active:scale-95 disabled:bg-night-700 disabled:text-slate-500 disabled:shadow-none" aria-label="Send" data-icon="send"></button>
        </div>
      </form>
      <p class="mt-2 flex flex-wrap items-center justify-center gap-x-3 gap-y-1 text-xs text-slate-400">
        <span class="flex items-center gap-1.5"><span class="text-slate-500" data-icon="lock"></span><span data-i18n="privacy"></span></span>
        <span class="tabular-nums"><span data-i18n="questionsLeft"></span> <b id="limitText" class="font-semibold text-slate-200">30/30</b></span>
      </p>
    </div>
  </main>

  <!-- Bottom navigation -->
  <nav id="tabbar" class="-mx-4 mt-2 hidden grid-cols-4 border-t border-white/5 px-2 pt-1.5" aria-label="Sections">
    <button type="button" data-tab="home" class="tab-btn"><span data-icon="house"></span><span data-i18n="tabHome"></span></button>
    <button type="button" data-tab="chat" class="tab-btn"><span data-icon="message-circle"></span><span data-i18n="tabChat"></span></button>
    <button type="button" data-tab="progress" class="tab-btn"><span data-icon="chart-no-axes-column"></span><span data-i18n="tabProgress"></span></button>
    <button type="button" data-tab="diary" class="tab-btn"><span data-icon="notebook-pen"></span><span data-i18n="tabDiary"></span></button>
  </nav>
</div>

<!-- Break overlay -->
<div id="breakOverlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-night-950/95 p-6 text-center backdrop-blur">
  <div class="w-full max-w-sm rounded-3xl bg-night-900 p-6 ring-1 ring-white/10">
    <img src="/img/break.webp" data-img="break" alt="" class="mx-auto h-48 w-48 rounded-full object-cover ring-4 ring-white/5">
    <h2 class="mt-5 text-2xl font-semibold text-white" data-i18n="breakTitle"></h2>
    <p class="mt-3 text-slate-300" data-i18n="breakText"></p>
    <div id="breakTimer" class="mt-6 rounded-2xl bg-night-800 py-4 text-5xl font-semibold tabular-nums text-brand-400 ring-1 ring-white/5">5:00</div>
  </div>
</div>

<!-- Parent report modal -->
<div id="reportModal" class="fixed inset-0 z-40 hidden items-end justify-center bg-black/60 sm:items-center sm:p-4">
  <div class="flex max-h-[90dvh] w-full max-w-xl flex-col rounded-t-3xl bg-night-900 ring-1 ring-white/10 sm:rounded-3xl">
    <div class="flex items-center gap-3 border-b border-white/5 p-4">
      <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-night-700" data-icon="users"></span>
      <h2 class="flex-1 text-lg font-semibold text-white" data-i18n="reportTitle"></h2>
      <button id="closeReport" type="button" class="flex h-11 w-11 items-center justify-center rounded-full bg-night-800 text-slate-300 hover:bg-night-700" aria-label="Close" data-icon="x"></button>
    </div>
    <div class="overflow-y-auto p-4">
      <div id="reportStats" class="grid grid-cols-3 gap-2"></div>
      <div id="reportText" class="bubble mt-4 whitespace-pre-wrap rounded-2xl bg-night-800 p-4 leading-relaxed text-slate-200 ring-1 ring-white/5"></div>
    </div>
    <div class="border-t border-white/5 p-4">
      <button id="printReport" type="button" class="flex min-h-12 w-full items-center justify-center gap-2 rounded-2xl bg-brand-500 font-semibold text-white hover:bg-brand-400"><span data-icon="printer"></span><span data-i18n="print"></span></button>
    </div>
  </div>
</div>

<script src="/vendor/katex/katex.min.js"></script>
<script src="/icons.js"></script>
<script src="/app.js"></script>
<script src="/learn-ui.js"></script>
</body>
</html>
