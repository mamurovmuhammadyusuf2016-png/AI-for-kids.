<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nimi AI — Face ID</title>
<link rel="icon" href="/img/favicon.png">
<!-- Opened by the Android app in Chrome: passkeys (Face ID, fingerprint) do not work inside the app's WebView.
     The ticket comes from the app; after the check a one-time code goes back to the app (like app-login.html). -->
<style>
  :root { color-scheme: light dark; --bg: #faf7ef; --text: #303b35; --muted: #66726a; --btn: #477a65; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --text: #ffffff; --muted: #9a9a9a; --btn: #2563eb; } }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
  main { width: 100%; max-width: 360px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  img { width: 96px; height: 96px; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; color: var(--muted); line-height: 1.5; }
  button, a.btn { min-height: 52px; width: 100%; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 16px; background: var(--btn); color: #fff; font: 600 17px system-ui, sans-serif; text-decoration: none; cursor: pointer; }
  button:disabled { opacity: .5; }
  a.btn { display: none; }
  #err { color: #b5504a; }
  @media (prefers-color-scheme: dark) { #err { color: #fb7185; } }
</style>
</head>
<body>
<main>
  <img src="/img/logo-mark.png" alt="Nimi AI">
  <h1 id="title"></h1>
  <p id="text"></p>
  <button id="go" type="button"></button>
  <a id="back" class="btn" href="#"></a>
  <p id="err"></p>
</main>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var uz = q.get('lang') === 'uz';
    var enroll = q.get('mode') === 'enroll';
    var T = uz
      ? { login: 'Kirishni tasdiqlang', enroll: "Face ID'ni yoqish", textLogin: 'Face ID yoki barmoq izi bilan tasdiqlang — keyin Nimi ilovasiga qaytasiz.', textEnroll: "Shu telefonni qo'shing: keyin adminkaga paroldan so'ng Face ID yoki barmoq izi bilan kirasiz.", goLogin: 'Face ID orqali kirish', goEnroll: "Shu telefonni qo'shish", back: 'Nimi ilovasiga qaytish', done: 'Tayyor! Ilovaga qaytish uchun quyidagi tugmani bosing.', error: "Bo'lmadi. Qayta urinib ko'ring.", expired: "Vaqt tugadi. Ilovaga qaytib, qaytadan boshlang.", unsupported: "Bu brauzer Face ID'ni bilmaydi. Chrome'ni yangilang." }
      : { login: 'Подтвердите вход', enroll: 'Включить Face ID', textLogin: 'Подтвердите вход через Face ID или отпечаток пальца — потом вы вернётесь в приложение Nimi.', textEnroll: 'Добавьте этот телефон: потом в админку после пароля нужно будет подтвердить Face ID или отпечаток.', goLogin: 'Войти по Face ID', goEnroll: 'Добавить этот телефон', back: 'Вернуться в приложение Nimi', done: 'Готово! Нажмите кнопку ниже, чтобы вернуться в приложение.', error: 'Не получилось. Попробуйте ещё раз.', expired: 'Время вышло. Вернитесь в приложение и начните заново.', unsupported: 'Этот браузер не умеет Face ID. Обновите Chrome.' };
    document.documentElement.lang = uz ? 'uz' : 'ru';
    document.getElementById('title').textContent = enroll ? T.enroll : T.login;
    document.getElementById('text').textContent = enroll ? T.textEnroll : T.textLogin;
    var go = document.getElementById('go');
    var back = document.getElementById('back');
    var err = document.getElementById('err');
    go.textContent = enroll ? T.goEnroll : T.goLogin;
    back.textContent = T.back;
    var ticket = q.get('t') || '';

    var toBuf = function (s) { return Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(s.length / 4) * 4, '=')), function (c) { return c.charCodeAt(0); }).buffer; };
    var b64 = function (buf) { return buf ? btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') : undefined; };
    var post = function (url, body) {
      return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
    };
    function toApp(code) {
      // The intent link names the app package, so no other app can take the code.
      var url = 'intent://auth?code=' + encodeURIComponent(code) + '#Intent;scheme=nimi;package=uz.nimi.app;end';
      document.getElementById('text').textContent = T.done;
      go.style.display = 'none';
      back.href = url;
      back.style.display = 'flex';
      location.href = url;
    }
    async function run() {
      if (!window.PublicKeyCredential || !navigator.credentials) { err.textContent = T.unsupported; return; }
      go.disabled = true;
      err.textContent = '';
      try {
        var o = await post('/api/auth/passkey/app-options', { ticket: ticket });
        if (!o.options) { err.textContent = o.code === 'passkey_expired' ? T.expired : T.error; return; }
        var opts = o.options, cred, r, response;
        if (o.kind === 'enroll') {
          cred = await navigator.credentials.create({ publicKey: Object.assign({}, opts, {
            challenge: toBuf(opts.challenge),
            user: Object.assign({}, opts.user, { id: toBuf(opts.user.id) }),
            excludeCredentials: (opts.excludeCredentials || []).map(function (c) { return Object.assign({}, c, { id: toBuf(c.id) }); }),
          }) });
          r = cred.response;
          response = { clientDataJSON: b64(r.clientDataJSON), attestationObject: b64(r.attestationObject), transports: r.getTransports ? r.getTransports() : [] };
        } else {
          cred = await navigator.credentials.get({ publicKey: Object.assign({}, opts, {
            challenge: toBuf(opts.challenge),
            allowCredentials: (opts.allowCredentials || []).map(function (c) { return Object.assign({}, c, { id: toBuf(c.id) }); }),
          }) });
          r = cred.response;
          response = { clientDataJSON: b64(r.clientDataJSON), authenticatorData: b64(r.authenticatorData), signature: b64(r.signature), userHandle: b64(r.userHandle) };
        }
        var d = await post('/api/auth/passkey/app-verify', {
          ticket: ticket,
          name: q.get('name') || 'Android',
          response: { id: cred.id, rawId: b64(cred.rawId), type: cred.type, clientExtensionResults: cred.getClientExtensionResults(), authenticatorAttachment: cred.authenticatorAttachment || undefined, response: response },
        });
        if (d.appCode) return toApp(d.appCode);
        err.textContent = d.code === 'passkey_expired' ? T.expired : T.error;
      } catch (e) {
        err.textContent = T.error;
      } finally {
        go.disabled = false;
      }
    }
    go.onclick = run;
  })();
</script>
</body>
</html>
