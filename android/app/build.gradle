// Nimi AI for Android: the site https://nimi-ai.onrender.com inside the app's own WebView,
// so it works on any phone (no Chrome needed). The page talks to the app through
// window.NimiAndroid (MainActivity.Bridge): reading aloud, voice input, Google sign-in via Chrome.
// Signing: the keystore is not in the repository; pass its path and passwords as
// NIMI_KEYSTORE, NIMI_KEYSTORE_PASSWORD, NIMI_KEY_ALIAS, NIMI_KEY_PASSWORD.
plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.nimi.app'
    compileSdk 36

    defaultConfig {
        applicationId 'uz.nimi.app'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            if (System.getenv('NIMI_KEYSTORE')) {
                storeFile file(System.getenv('NIMI_KEYSTORE'))
                storePassword System.getenv('NIMI_KEYSTORE_PASSWORD')
                keyAlias System.getenv('NIMI_KEY_ALIAS') ?: 'nimi'
                keyPassword System.getenv('NIMI_KEY_PASSWORD') ?: System.getenv('NIMI_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // Not shrunk: the page calls the bridge methods by name.
            minifyEnabled false
            if (System.getenv('NIMI_KEYSTORE')) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.12.4'
    implementation 'androidx.browser:browser:1.9.0'
}
